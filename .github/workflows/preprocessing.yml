name: Automated Preprocessing - Hate Speech Dataset

on:
  push:
    branches:
      - main
    paths:
      - 'preprocessing/**'
      - 'data/**'
      - '.github/workflows/preprocessing.yml'
  workflow_dispatch:
    inputs:
      test_size:
        description: 'Proporsi test split (0.1 - 0.3)'
        required: false
        default: '0.2'
      max_features:
        description: 'Jumlah maksimum fitur TF-IDF'
        required: false
        default: '10000'

jobs:
  automate-preprocessing:
    name: Run Automated Preprocessing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-preprocess-${{ hashFiles('preprocessing/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-preprocess-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn nltk joblib

      - name: Download NLTK resources
        run: |
          python -c "
          import nltk
          nltk.download('punkt')
          nltk.download('stopwords')
          nltk.download('punkt_tab')
          print('NLTK resources downloaded.')
          "

      - name: Run automate preprocessing
        run: |
          cd preprocessing
          python automate_NamaSiswa.py \
            --data ../data/data.csv \
            --kamusalay ../data/new_kamusalay.csv \
            --output hate_speech_preprocessing \
            --test_size ${{ github.event.inputs.test_size || '0.2' }} \
            --max_features ${{ github.event.inputs.max_features || '10000' }}

      - name: Verify output files
        run: |
          echo "=== Verifikasi output preprocessing ==="
          ls -lh preprocessing/hate_speech_preprocessing/
          echo ""
          echo "=== Info dataset ==="
          python -c "
          import pandas as pd
          df = pd.read_csv('preprocessing/hate_speech_preprocessing/hate_speech_preprocessed.csv')
          print(f'Total baris: {len(df)}')
          print(f'Distribusi HS:\n{df[\"HS\"].value_counts()}')
          "

      - name: Commit and push preprocessed data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add preprocessing/hate_speech_preprocessing/
          git diff --staged --quiet || git commit -m "chore: update preprocessed dataset [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hate_speech_preprocessing
          path: preprocessing/hate_speech_preprocessing/
          retention-days: 30
